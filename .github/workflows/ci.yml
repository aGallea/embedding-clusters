---
name: CI

"on":
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check embedding_cluster/
      - run: uv run ruff format --check embedding_cluster/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras
      - run: uv run mypy embedding_cluster/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras
      - run: >-
          uv run pytest tests/ -v
          --cov=embedding_cluster
          --cov-report=term-missing
          --cov-report=xml:coverage/cobertura-coverage.xml
          --junitxml=coverage/junit.xml

      - name: Coverage Report
        if: always() && github.event_name == 'pull_request'
        uses: aGallea/tests-coverage-report@1.3.11
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-percentage: '90'
          fail-under-coverage-percentage: 'true'
